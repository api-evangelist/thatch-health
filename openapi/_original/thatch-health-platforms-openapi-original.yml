          example: https://app.thatch.com/member/onboarding/welcome?invite_token=abc123
        date_of_birth:
          type: string
          description: The employee's date of birth in YYYY-MM-DD format
          format: date
          example: '1989-07-15'
        zip:
          type: string
          description: The employee's five-digit ZIP code
          example: '94103'
        dependents:
          type: array
          description: >-
            Dependents of the employee. Each entry contains relationship: spouse
            or child, and date of birth: MM-DD-YYYY string format.
          example:
            - relationship: spouse
