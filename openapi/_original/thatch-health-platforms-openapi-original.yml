          description: The enrollment's history of status change events
          items:
            $ref: '#/components/schemas/EnrollmentStatusEvent'
        plan:
          type: object
          description: The medical plan associated with the enrollment, if one exists
          allOf:
            - $ref: '#/components/schemas/MedicalPlan'
        plan_id:
          type: string
          description: Deprecated - use plan.id instead
          example: mdpln_01j7h53nf2j0hc5a235b6xmxn4
          deprecated: true
        plan_code:
          type: string
          description: The enrollment's external plan code or plan name.
          example: standard
        premium:
          type: object
          description: >-
            The enrollment's most recent premium. The premium can change over
            time, for example, if the employee's dependents change.
          allOf:
            - $ref: '#/components/schemas/Money'
        broker:
          type: object
          description: Detailed information about the broker associated with the enrollment
          allOf:
            - $ref: '#/components/schemas/Broker'
        enrollment_coverages:
          type: array
          description: >-
            Detailed information about each participant covered by the
            enrollment
          items:
            $ref: '#/components/schemas/EnrollmentCoverage'
      description: Enrollment model
    EnrollmentStatusEvent:
      required:
        - status
        - timestamp
      type: object
      properties:
        status:
          type: string
          description: The status that the enrollment changed to
          example: completed
          enum:
            - in_member_cart
            - member_confirmed
            - submission_processing
            - carrier_processing
            - completed
            - canceled
        timestamp:
          type: string
          description: The ISO 8601 date and time the enrollment's status changed
          example: '2024-11-01T00:00:00Z'
    MedicalPlan:
      required:
        - carrier_name
        - hsa_eligible
        - id
        - name
      type: object
      properties:
        id:
          type: string
          description: The ID of the medical plan
          example: mdpln_01j7h53nf2j0hc5a235b6xmxn4
        name:
          type: string
          description: The name of the plan
          example: Anthem Bronze 60 D HMO
        carrier_name:
          type: string
          description: The name of the carrier
          example: Anthem
        hsa_eligible:
          type: boolean
          description: Whether the plan is HSA eligible
          example: false
        logo_url:
          type: string
          description: The URL of the carrier logo
        sbc_url:
          type: string
          description: URL to the plan's SBC document
    Broker:
      required:
        - name
        - npn
      type: object
      properties:
        name:
          type: string
          description: The broker's name
          example: Thatch Health Insurance Services LLC
        npn:
          type: string
          description: The broker's National Producer Number (NPN)
          example: '20782309'
    EnrollmentCoverage:
      required:
        - date_of_birth
        - end_date
        - first_name
        - gender
        - last_name
        - relationship
        - start_date
      type: object
      properties:
        first_name:
          type: string
          description: The enrolled participant's first name
          example: Ana
        last_name:
          type: string
          description: The enrolled participant's last name
          example: Diaz
        relationship:
          type: string
          description: The relationship of the enrolled participant to the member
          example: self
          enum:
            - self
            - spouse
            - child
        date_of_birth:
          type: string
          description: The enrolled participant's date of birth in YYYY-MM-DD format
          format: date
          example: '1990-01-02'
        gender:
          type: string
          description: The enrolled participant's gender
          example: female
          enum:
            - female
            - male
            - non_binary
        start_date:
          type: string
          description: Start date of the coverage period (inclusive)
          example: '2024-05-01'
        end_date:
          type: string
          description: End date of the coverage period (inclusive)
          example: '2024-12-31'
    PaginatedMemberList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        pagination:
          $ref: '#/components/schemas/Pagination'
      description: PaginatedMemberList model
    Member:
      required:
        - address_line1
        - city
        - date_of_birth
        - employee_id
        - first_name
        - id
        - last_name
        - state
        - zip
      type: object
      properties:
        id:
          type: string
          description: The member's unique identifier
          example: mbr_01j85kpd8yxkabyrm83d3h2ya3
        employee_id:
          type: string
          description: The unique identifier for the employee associated with the member
          example: employee_01j7h53r7gpd0q0wtx4pcfcska
        first_name:
          type: string
          description: The member's first name
          example: Ana
        last_name:
          type: string
          description: The member's last name
          example: Diaz
        address_line1:
          type: string
          description: The member's address (line 1)
          example: 123 Main St
        address_line2:
          type: string
          description: The member's address (line 2)
        city:
          type: string
          description: The member's city
          example: San Francisco
        state:
          type: string
          description: The member's state
          example: CA
          enum:
            - AK
            - AL
            - AR
            - AZ
            - CA
            - CO
            - CT
            - DC
            - DE
            - FL
            - GA
            - HI
            - IA
            - ID
            - IL
            - IN
            - KS
            - KY
            - LA
            - MA
            - MD
            - ME
            - MI
            - MN
            - MO
            - MS
            - MT
            - NC
            - ND
            - NE
            - NH
            - NJ
            - NM
            - NV
            - NY
            - OH
            - OK
            - OR
            - PA
            - RI
            - SC
            - SD
            - TN
            - TX
            - UT
            - VA
            - VT
            - WA
            - WI
            - WV
            - WY
        zip:
          type: string
          description: The member's ZIP code, with optional +4
          example: '94108'
        date_of_birth:
          type: string
          description: The member's date of birth in YYYY-MM-DD format
          format: date
          example: '1989-07-15'
        allowance:
          type: object
          description: The member's current ICHRA allowance
          example:
            amount: 65000
            currency_code: USD
          allOf:
            - $ref: '#/components/schemas/Money'
        balance:
          type: object
          description: The member's current ICHRA account balance
          example:
            amount: 4500
            currency_code: USD
          allOf:
            - $ref: '#/components/schemas/Money'
      description: Member model
  securitySchemes:
    Bearer:
      type: apiKey
      description: >-
        Provide your API key in a `Bearer` token header (as in, **Bearer
        sk_123**).
      name: Authorization
      in: header
