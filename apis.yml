aid: thatch-health
name: Thatch Health
description: Thatch (Thatch Health, Inc.) is a modern health benefits platform that
  makes it easy for employers to offer personalized healthcare to employees using
  an ICHRA (Individual Coverage Health Reimbursement Arrangement). Thatch for Platforms
  is a set of REST APIs and embeddable components that let partner platforms — payroll,
  HR, and benefits products — bring ICHRA benefits to their customers, covering employer
  onboarding, employee management, enrollments, members, pay schedules, and payroll
  deductions.
