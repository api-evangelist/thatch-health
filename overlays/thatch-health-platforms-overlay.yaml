    x-apievangelist-notes:
    - List endpoints paginate with page[number]/page[size] (default 20, max 1,000)
      and return a pagination object (total_records, current_page, total_pages,
      next_page, prev_page).
    - Employers, employees, and pay schedules support a metadata key-value object;
